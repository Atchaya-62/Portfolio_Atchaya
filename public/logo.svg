<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b87f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f3f0ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)"/>
  
  <!-- Letters AS with modern design -->
  <text x="100" y="130" font-family="Arial Black, sans-serif" font-size="90" font-weight="900" fill="url(#textGradient)" text-anchor="middle" letter-spacing="-5">AS</text>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="40" r="8" fill="#ffffff" opacity="0.3"/>
  <circle cx="160" cy="100" r="6" fill="#ffffff" opacity="0.3"/>
  <circle cx="40" cy="100" r="6" fill="#ffffff" opacity="0.3"/>
  <circle cx="100" cy="160" r="8" fill="#ffffff" opacity="0.3"/>
</svg>
